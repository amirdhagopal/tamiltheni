name: Deploy to GitHub Pages

on:
  push:
    branches: [publish]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build & Verify Pages Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify Pages artifacts in docs/
        run: |
          test -f docs/index.html
          test -f docs/sw.js
          test -f docs/manifest.webmanifest
          test -f docs/html/theni1.html
          test -f docs/html/theni2.html
          test -f docs/html/theni34.html
          test -f docs/html/theni5.html
